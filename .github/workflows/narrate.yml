# Generates the spoken narration for every story on GitHub's machines, not
# yours, and commits the audio back to the repo. Cloudflare then publishes it
# like any other file, so a reader just plays audio instead of the browser
# trying to speak the page.
#
# Run it from the repo's Actions tab: "Narrate the stories" -> Run workflow.
# It is never automatic; nothing happens until you press the button.
name: Narrate the stories

on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Kokoro voice (bf_isabella, bf_emma, bm_george, bm_lewis, am_michael, af_heart)'
        default: 'bf_isabella'
        required: false
      redo:
        description: 'Re-narrate everything, replacing existing audio'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: narrate
  cancel-in-progress: false

jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System audio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg

      - name: Python deps
        run: pip install --quiet kokoro-onnx soundfile numpy imageio-ffmpeg

      # 310 MB of weights: fetched once, then reused by every later run
      - name: Cache Kokoro model
        id: model
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0

      - name: Fetch Kokoro model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL -o .kokoro/kokoro-v1.0.onnx  $base/kokoro-v1.0.onnx
          curl -sL -o .kokoro/voices-v1.0.bin   $base/voices-v1.0.bin

      - name: Clear existing audio
        if: inputs.redo
        run: rm -rf public/audio src/data/audio

      - name: Narrate shard ${{ matrix.shard }}
        env:
          KOKORO_VOICE: ${{ inputs.voice }}
        run: python scripts/narrate.py --shard ${{ matrix.shard }} --of 8

      - uses: actions/upload-artifact@v4
        with:
          name: narration-${{ matrix.shard }}
          path: |
            public/audio
            src/data/audio
          if-no-files-found: ignore
          retention-days: 1

  collect:
    needs: speak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: narration-*
          merge-multiple: true
          path: .

      - name: Commit the narration
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio src/data/audio
          if git diff --staged --quiet; then
            echo "No new audio to commit."
            exit 0
          fi
          files=$(git diff --staged --name-only | wc -l)
          size=$(du -sh public/audio | cut -f1)
          git commit -m "Add narration for $files stories ($size total)"
          git push
